[package]
name = "aether3d-native"
version = "0.17.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
description = "Native kernels for Aether3D: ray traversal, transform hierarchies, PNG filters, triangulation, skinning"
repository = "https://github.com/Murisixz/Aether3D"
publish = false

[lib]
name = "aether3d_native"
crate-type = ["cdylib"]

[dependencies]
# abi3-py311: one wheel per platform for every CPython >= 3.11 (the buffer protocol is in
# the stable ABI from 3.11). Licensed MIT OR Apache-2.0.
pyo3 = { version = "=0.30.1", features = ["abi3-py311", "extension-module"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# No target-cpu: wheels run on every CPU of their platform. Rust never contracts a * b + c
# into a fused multiply-add on its own, so the arithmetic is the NumPy code's, bit for bit.
