[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "aether3d-native"
version = "0.18.0"
description = "Native (Rust) kernels for Aether3D: ray traversal, transform hierarchies, PNG filters, triangulation"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Murisixz" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Multimedia :: Graphics :: 3D Rendering",
]

[project.urls]
Homepage = "https://github.com/Murisixz/Aether3D"

[tool.maturin]
module-name = "aether3d_native"
features = ["pyo3/extension-module"]
