[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "aether3d"
dynamic = ["version"]
description = "An open-source, AI-native, code-first 3D engine."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "The Aether3D Authors" }]
keywords = ["3d", "engine", "scene-graph", "geometry", "gltf", "procedural", "rendering", "gpu", "webgpu", "ai-agents", "mcp"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
# Solid booleans (the "boolean" modifier) use Manifold (Apache-2.0).
boolean = ["manifold3d>=3.4"]
# JPEG textures are decoded with Pillow (MIT-CMU); PNG textures need nothing extra.
images = ["pillow>=10"]
# GPU rendering uses wgpu-py (BSD-2-Clause) with wgpu-native (MIT OR Apache-2.0), which
# needs Python 3.11+. Pinned to the tested minor series: wgpu-py's API is not yet stable.
gpu = ["wgpu>=0.32,<0.33; python_version >= '3.11'"]
# The MCP server (aether3d mcp serve) uses the official MCP Python SDK (MIT).
mcp = ["mcp>=2.3,<3"]
# Test-only: Pillow decodes PNGs independently of Aether3D's own encoder and decoder.
dev = [
    "pytest>=7",
    "ruff>=0.5",
    "trimesh>=4",
    "manifold3d>=3.4",
    "pillow>=10",
    "wgpu>=0.32,<0.33; python_version >= '3.11'",
    "mcp>=2.3,<3",
]

[project.scripts]
aether3d = "aether3d.cli:main"

[project.urls]
Homepage = "https://github.com/Murisixz/Aether3D"
Issues = "https://github.com/Murisixz/Aether3D/issues"

[tool.hatch.version]
path = "src/aether3d/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/aether3d"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
