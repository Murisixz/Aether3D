[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "aether3d"
dynamic = ["version"]
description = "An open-source, AI-native, code-first 3D engine."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "The Aether3D Authors" }]
keywords = ["3d", "engine", "scene-graph", "geometry", "gltf", "ai-agents"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5", "trimesh>=4"]

[project.scripts]
aether3d = "aether3d.cli:main"

[project.urls]
Homepage = "https://github.com/Murisixz/Aether3D"
Issues = "https://github.com/Murisixz/Aether3D/issues"

[tool.hatch.version]
path = "src/aether3d/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/aether3d"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
