name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pytest
      - name: Run examples and check the results with the CLI
        run: |
          python examples/first_scene.py ci_example.aether
          aether3d validate ci_example.aether --json
          aether3d inspect ci_example.aether
          python examples/gltf_roundtrip.py ci_gltf
          aether3d validate ci_gltf/town.glb --json
          aether3d geometry ci_gltf/town.glb
          python examples/minecraft_hero.py ci_hero
          aether3d inspect ci_hero/blocky_hero.glb

  khronos-validator:
    name: Khronos glTF Validator (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: npm ci --prefix tools/gltf-validator
      - name: Validate exports with the Khronos glTF Validator
        env:
          AETHER3D_REQUIRE_GLTF_VALIDATOR: "1"
        run: pytest tests/test_khronos_validator.py tests/test_editing_gltf.py -v
      - name: Validate the demonstration scenes
        run: |
          python examples/gltf_roundtrip.py ci_gltf --require-validator
          python examples/minecraft_hero.py ci_hero --require-validator
