name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - name: The wheel ships the data files (plan and feedback guides, plan examples, WGSL shaders)
        run: |
          pip wheel --no-deps -w dist .
          python - <<'EOF'
          import glob, sys, zipfile
          names = set(zipfile.ZipFile(glob.glob("dist/aether3d-*.whl")[0]).namelist())
          need = ["aether3d/plans/guide.md", "aether3d/feedback/guide.md", "aether3d/mcp/server.py"]
          need += ["aether3d/cad/guide.md", "aether3d/animation/guide.md"]
          need += [f"aether3d/plans/examples/{n}.json" for n in ("basics", "castle", "village")]
          need += ["aether3d/rendering/gpu/wgsl/scene.wgsl"]
          missing = [n for n in need if n not in names]
          sys.exit(f"missing from the wheel: {missing}" if missing else 0)
          EOF

  test:
    # Portable tests: everything except GPU rendering, which the gpu jobs below cover.
    # The CPU path tracer is portable and runs here, including its deterministic image
    # test (tests/test_pathtrace_golden.py) and the showcase scenes in quick mode.
    name: test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    env:
      AETHER3D_GPU_TESTS: skip
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pytest
      - name: Run examples and check the results with the CLI
        run: |
          python examples/first_scene.py ci_example.aether
          aether3d validate ci_example.aether --json
          aether3d inspect ci_example.aether
          python examples/gltf_roundtrip.py ci_gltf
          aether3d validate ci_gltf/town.glb --json
          aether3d geometry ci_gltf/town.glb
          python examples/minecraft_hero.py ci_hero
          aether3d inspect ci_hero/blocky_hero.glb
          python examples/minecraft_castle.py ci_castle
          aether3d procedural validate ci_castle/castle.aether --json
          aether3d procedural inspect ci_castle/castle.aether --evaluate
          aether3d procedural set ci_castle/castle.aether tower_count=10 castle_width=40 --dry-run --json
          aether3d geometry ci_castle/castle.glb
      - name: Render with Aether3D's CPU renderer and check the PNGs
        run: |
          python examples/first_render.py ci_render --width 320 --height 180 --samples 2
          python examples/minecraft_castle_render.py ci_render --width 640 --height 360 --samples 2
          python examples/hero_render.py ci_render --width 320 --height 180 --samples 2
          aether3d render ci_render/minecraft_castle_render.aether -o ci_render/cli_castle.png --width 480 --height 270 --json
          aether3d render ci_castle/castle.aether -o ci_render/framed_stage4_castle.png --frame --width 320 --height 180
          python -c "from PIL import Image; import sys; [print(p, Image.open(p).size, Image.open(p).mode) for p in sys.argv[1:]]" ci_render/aether3d_first_render.png ci_render/minecraft_castle_render.png ci_render/blocky_hero_render.png ci_render/cli_castle.png ci_render/framed_stage4_castle.png ci_render/castle_flat_vs_materials.png ci_render/hero_flat_vs_materials.png
      - name: Materials and textures from the CLI
        run: |
          python examples/make_textures.py ci_textures
          aether3d material list ci_render/minecraft_castle_render.aether
          aether3d material validate ci_render/minecraft_castle_render.aether --json
          aether3d texture list ci_render/minecraft_castle_render.aether --json
          aether3d material create ci_example.aether Stone --preset stone --json
          aether3d material assign ci_example.aether Stone Cube --json
          aether3d material preview ci_example.aether Stone -o ci_render/stone_preview.png --size 128
          aether3d material create ci_example.aether Bricks --preset brick --set coordinates=uv --json
          aether3d material assign ci_example.aether Bricks Sphere --json
          aether3d export ci_example.aether ci_render/baked.glb --bake-textures 64 --json
          aether3d export ci_render/minecraft_castle_render.aether ci_render/castle_materials.glb --json
      - name: Path tracer (CPU) - showcase scenes with their checks, CLI and passes
        run: |
          python examples/cornell_box.py ci_path --quick
          python examples/metal_spheres.py ci_path --quick
          python examples/ao_contact.py ci_path --quick
          python examples/castle_path_render.py ci_path --quick
          python examples/window_room.py ci_path --quick
          python examples/hero_path_render.py ci_path --quick
          aether3d render ci_render/minecraft_castle_render.aether -o ci_path/cli_castle_path.png --backend path --width 160 --height 90 --spp 4 --bounces 2 --ao --passes ci_path/passes --json
          aether3d render ci_render/minecraft_castle_render.aether -o ci_path/cli_castle_path.hdr --backend path --width 64 --height 36 --spp 2 --tonemap neutral
          python benchmarks/bench_raytrace.py --quick
      - name: Scene plans and the MCP server - examples and a benchmark smoke run
        run: |
          python examples/plan_basics.py ci_plans --quick
          python examples/village.py ci_plans --quick --backend cpu
          python examples/mcp_castle_agent.py ci_plans --quick --backend cpu
          aether3d plan validate src/aether3d/plans/examples/castle.json
          python benchmarks/bench_plans.py --quick --sizes 100 --no-cli-per-object --no-gpu --json ci_plans/bench_plans.json
      - name: Upload the CI renders
        uses: actions/upload-artifact@v4
        with:
          name: renders-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            ci_render/*.png
            ci_path/*.png
            ci_path/*.json
            ci_plans/*.png
            ci_plans/*.json
          if-no-files-found: error

  optional-dependencies:
    # The core must work without the optional boolean and GPU backends, and with the
    # oldest supported manifold3d (the version Arch Linux packages).
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: without manifold3d and wgpu (Python 3.10)
            python-version: "3.10"
            install: pip install -e . pytest trimesh pillow
          - name: without wgpu (Python 3.13)
            python-version: "3.13"
            install: pip install -e ".[boolean]" pytest trimesh pillow
          - name: oldest manifold3d (Python 3.10)
            python-version: "3.10"
            install: pip install -e ".[dev]" "manifold3d==3.4.1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: ${{ matrix.install }}
      - run: python -c "import importlib.util as u; print('manifold3d available:', bool(u.find_spec('manifold3d')), '/ wgpu available:', bool(u.find_spec('wgpu')))"
      - run: pytest -rs
      - name: The CPU renderer works without wgpu; the GPU explains why it is unavailable
        run: |
          aether3d gpu info
          aether3d gpu info --json
          python examples/first_render.py ci_cpu --width 160 --height 90 --samples 1

  gpu-linux:
    # Required: real GPU draw calls, framebuffer readback and pixel checks on Mesa's
    # lavapipe, a conformant software Vulkan implementation (GitHub's Linux runners have
    # no graphics hardware). It validates the graphics API path, not hardware speed.
    name: GPU (ubuntu-latest, Vulkan lavapipe, Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    env:
      AETHER3D_REQUIRE_GPU: "1"
      AETHER3D_TEST_GPU_ADAPTER: llvmpipe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - name: Install Mesa's software Vulkan driver (lavapipe) and the Vulkan validation layers
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libvulkan1 vulkan-tools
          sudo apt-get install -y vulkan-validationlayers || echo "validation layers unavailable: wgpu validates on its own"
          vulkaninfo --summary || true
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: GPU adapters and a self-test render
        run: |
          aether3d gpu info --check --adapter llvmpipe
          aether3d gpu info --check --adapter llvmpipe --json > gpu-info.json
      - name: GPU tests (must run, not skip)
        run: pytest tests/test_gpu_selection.py tests/test_gpu_data.py tests/test_shadow_planning.py tests/test_gpu_render.py tests/test_gpu_shadows.py tests/test_gpu_faults.py tests/test_gpu_cli.py tests/test_gpu_performance.py tests/test_gpu_materials.py tests/test_gpu_pathtrace.py -v -rs
      - name: Whole suite with the GPU available
        run: pytest -rs
      - name: GPU examples, CLI and a benchmark smoke run (software adapter, not hardware speed)
        run: |
          python examples/gpu_render.py ci_gpu --width 640 --height 360 --adapter llvmpipe --require-gpu
          aether3d render examples/output/minecraft_castle_render.aether -o ci_gpu/cli_castle_gpu.png --backend gpu --adapter llvmpipe --width 480 --height 270 --shadows --json > ci_gpu/cli_render.json
          python benchmarks/bench_gpu.py --quick --no-4k --adapter llvmpipe --json ci_gpu/bench_lavapipe.json
          python benchmarks/bench_feedback.py --smoke --adapter llvmpipe --json ci_gpu/bench_feedback_smoke.json
          python examples/gpu_path_showcase.py ci_gpu --quick --adapter llvmpipe
          aether3d render examples/output/minecraft_castle_render.aether -o ci_gpu/cli_castle_gpu_path.png --backend gpu_path --adapter llvmpipe --width 160 --height 90 --spp 4 --bounces 2 --json > ci_gpu/cli_render_gpu_path.json
          python -c "from PIL import Image; import sys; [print(p, Image.open(p).size, Image.open(p).info.get('Source')) for p in sys.argv[1:]]" ci_gpu/*.png
      - name: Upload the GPU renders
        uses: actions/upload-artifact@v4
        with:
          name: gpu-renders-lavapipe-py${{ matrix.python-version }}
          path: |
            ci_gpu/*.png
            ci_gpu/*.json
            gpu-info.json
          if-no-files-found: error

  gpu-native:
    # Optional: whatever graphics adapter the hosted runner offers (Direct3D 12 or Vulkan on
    # Windows, Metal on macOS). GPU tests run when an adapter works and are skipped with the
    # reason otherwise; the report says which adapter (if any) was used.
    name: GPU (${{ matrix.os }}, native adapter if any)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: GPU adapters
        run: aether3d gpu info
      - name: GPU self-test (reports, does not fail, if no adapter works)
        shell: bash
        run: aether3d gpu info --check --json > gpu-info.json || echo "GPU rendering does not work on this runner (see gpu-info.json)"
      - name: GPU tests (skipped with the reason when no adapter works)
        run: pytest tests/test_gpu_selection.py tests/test_gpu_data.py tests/test_shadow_planning.py tests/test_gpu_render.py tests/test_gpu_shadows.py tests/test_gpu_faults.py tests/test_gpu_cli.py tests/test_gpu_performance.py tests/test_gpu_materials.py tests/test_gpu_pathtrace.py -rs --durations=3
      - name: GPU rendering with DXC (Windows; AETHER3D_GPU_DXC; FXC, the default, ran above)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dxc = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\dxcompiler.dll" | Sort-Object FullName | Select-Object -Last 1
          $env:AETHER3D_GPU_DXC = $dxc.FullName
          aether3d gpu info --check
          pytest tests/test_gpu_render.py tests/test_gpu_pathtrace.py -rs --durations=3
      - name: GPU example (only if an adapter works)
        shell: bash
        run: |
          if aether3d gpu info --check > /dev/null; then
            python examples/gpu_render.py ci_gpu --width 640 --height 360 --require-gpu
          else
            echo "no working GPU adapter on this runner: GPU example skipped"; mkdir -p ci_gpu
          fi
      - name: Upload the GPU report and renders
        uses: actions/upload-artifact@v4
        with:
          name: gpu-${{ matrix.os }}
          path: |
            gpu-info.json
            ci_gpu/*.png
          if-no-files-found: warn

  khronos-validator:
    name: Khronos glTF Validator (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: npm ci --prefix tools/gltf-validator
      - name: Validate exports with the Khronos glTF Validator
        env:
          AETHER3D_REQUIRE_GLTF_VALIDATOR: "1"
        run: pytest tests/test_khronos_validator.py tests/test_editing_gltf.py tests/test_procedural_gltf.py tests/test_render_gltf.py tests/test_material_gltf_validator.py tests/test_animation_gltf.py -v
      - name: Validate the demonstration scenes
        run: |
          python examples/gltf_roundtrip.py ci_gltf --require-validator
          python examples/minecraft_hero.py ci_hero --require-validator
          python examples/minecraft_castle.py ci_castle --require-validator

  native-lint:
    # The Rust crate of the native kernels (native/): formatting and clippy's lints.
    name: native kernels (rustfmt, clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain (the runner's rustup)
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - run: cargo fmt --manifest-path native/Cargo.toml --check
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: clippy (warnings are errors)
        env:
          PYO3_PYTHON: python
        run: cargo clippy --manifest-path native/Cargo.toml --release -- -D warnings

  native:
    # Aether3D with its native kernels (native/, aether3d-native): built from source with
    # the runner's Rust, installed next to Aether3D and required by the tests
    # (AETHER3D_REQUIRE_NATIVE). The jobs above run without them: the NumPy fallbacks.
    name: native kernels (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    env:
      AETHER3D_GPU_TESTS: skip
      AETHER3D_REQUIRE_NATIVE: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"  # the oldest the wheels' stable ABI supports
          - os: ubuntu-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - name: Rust toolchain (the runner's rustup)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]" "maturin>=1.9,<2"
      - name: Build the native wheel and install it
        shell: bash
        run: |
          maturin build --release --manifest-path native/Cargo.toml --out native-wheels
          pip install --no-index --find-links native-wheels aether3d-native
          python -c "from aether3d import _native; print(_native.status())"
      - name: Native kernels against the NumPy implementations (parity, errors, GIL, memory)
        run: pytest tests/test_native.py -v -rs
      - name: Whole suite with the native kernels (render goldens and path tracer bit for bit)
        run: pytest -rs
      - name: The NumPy fallbacks, with the package installed but switched off
        shell: bash
        env:
          AETHER3D_NATIVE: "0"
          AETHER3D_REQUIRE_NATIVE: "0"
        run: pytest tests/test_pathtrace_golden.py tests/test_pathtrace.py tests/test_spatial_queries.py tests/test_invariants.py tests/test_render_png.py tests/test_material_images.py -rs
      - name: Upload the wheel
        uses: actions/upload-artifact@v4
        with:
          name: aether3d-native-${{ matrix.os }}-py${{ matrix.python-version }}
          path: native-wheels/*.whl
